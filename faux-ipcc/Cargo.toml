[package]
name = "faux-ipcc"
version = "0.1.0"
edition = "2021"

[dependencies]
attest-data.git = "https://github.com/oxidecomputer/dice-util"
host-sp-messages.git = "https://github.com/oxidecomputer/hubris"

ipcc-data.path = "../ipcc-data"

anyhow = "1.0.96"
clap = { version = "4.5.31", features = ["derive", "env"] }
corncobs = "0.1.3"
hex = "0.4.3"
slog = { version = "2.7.0", features = ["max_level_trace", "release_max_level_debug"] }
ftdi = { version = "0.1.3", optional = true }
slog-async = "2.8.0"
slog-term = "2.9.1"
zerocopy = "0.8.27"
humantime = "2.1.0"
x509-cert = "0.2.5"
hubpack = "0.1.2"

# serialport doesn't support illumos
[target.'cfg(not(target_os = "illumos"))'.dependencies.serialport_upstream]
package = "serialport"
version = "4.7.0"

[target.'cfg(target_os = "illumos")'.dependencies.serialport_illumos]
package = "serialport"
git = "https://github.com/jgallagher/serialport-rs.git"
branch = "illumos-support"
