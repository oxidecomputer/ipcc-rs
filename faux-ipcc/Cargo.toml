[package]
name = "faux-ipcc"
version = "0.1.0"
edition = "2021"

[dependencies]
attest-data.git = "https://github.com/oxidecomputer/dice-util"
host-sp-messages = { git = "https://github.com/oxidecomputer/hubris", branch = "mkeeter/ipcc-apob" }

ipcc-data.path = "../ipcc-data"

anyhow = "1.0.96"
clap = { version = "4.5.31", features = ["derive", "env"] }
corncobs = "0.1.3"
hex = "0.4.3"
serialport = "4.7.0"
slog = { version = "2.7.0", features = ["max_level_trace", "release_max_level_debug"] }
ftdi = "0.1.3"
slog-async = "2.8.0"
slog-term = "2.9.1"
zerocopy = "0.8.25"
humantime = "2.1.0"
x509-cert = "0.2.5"
hubpack = "0.1.2"
sha2 = "0.10.9"
